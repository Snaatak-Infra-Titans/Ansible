---
- name: Configure PostgreSQL for Attendance API
  hosts: postgresql
  become: true
  gather_facts: false

  vars_files:
    - vars/dev.yml

  handlers:
    - name: Restart PostgreSQL
      ansible.builtin.systemd:
        name: "{{ postgresql_service_name }}"
        state: restarted

  tasks:
    - name: Configure PostgreSQL with rollback support
      block:
        - name: Install PostgreSQL packages
          ansible.builtin.apt:
            name:
              - "postgresql-{{ postgresql_version }}"
              - "postgresql-client-{{ postgresql_version }}"
              - python3-psycopg2
            state: present
            update_cache: true

        - name: Enable and start PostgreSQL
          ansible.builtin.systemd:
            name: "{{ postgresql_service_name }}"
            enabled: true
            state: started

        - name: Create rollback directory
          ansible.builtin.file:
            path: "{{ postgresql_backup_dir }}"
            state: directory
            owner: root
            group: root
            mode: "0700"

        - name: Backup postgresql.conf
          ansible.builtin.copy:
            src: "{{ postgresql_conf }}"
            dest: "{{ postgresql_backup_dir }}/postgresql.conf"
            remote_src: true
            force: false
            mode: "0600"

        - name: Backup pg_hba.conf
          ansible.builtin.copy:
            src: "{{ postgresql_hba }}"
            dest: "{{ postgresql_backup_dir }}/pg_hba.conf"
            remote_src: true
            force: false
            mode: "0600"

        - name: Check whether attendance database already exists
          community.postgresql.postgresql_query:
            db: postgres
            login_unix_socket: /var/run/postgresql
            query: >-
              SELECT 1
              FROM pg_database
              WHERE datname = '{{ postgresql_database }}';
          become_user: postgres
          register: database_before_deployment

        - name: Remember whether database existed before deployment
          ansible.builtin.set_fact:
            attendance_database_preexisting: >-
              {{ database_before_deployment.rowcount | int > 0 }}

        - name: Configure PostgreSQL listen addresses
          ansible.builtin.lineinfile:
            path: "{{ postgresql_conf }}"
            regexp: '^\s*#?\s*listen_addresses\s*='
            line: "listen_addresses = '{{ postgresql_listen_addresses }}'"
          notify: Restart PostgreSQL

        - name: Allow Attendance API access
          ansible.builtin.blockinfile:
            path: "{{ postgresql_hba }}"
            marker: "# {mark} ATTENDANCE API ACCESS"
            block: |
              host    {{ postgresql_database }}    {{ postgresql_user }}    {{ postgresql_allowed_cidr }}    {{ postgresql_auth_method }}
          notify: Restart PostgreSQL

        - name: Apply PostgreSQL configuration
          ansible.builtin.meta: flush_handlers

        - name: Wait for PostgreSQL
          ansible.builtin.command:
            argv:
              - pg_isready
              - -h
              - 127.0.0.1
              - -p
              - "{{ postgresql_port | string }}"
          register: postgresql_ready
          changed_when: false
          retries: 10
          delay: 3
          until: postgresql_ready.rc == 0

        - name: Set PostgreSQL user password
          community.postgresql.postgresql_user:
            name: "{{ postgresql_user }}"
            password: "{{ postgresql_password }}"
            role_attr_flags: LOGIN
            state: present
            login_unix_socket: /var/run/postgresql
          become_user: postgres
          no_log: true

        - name: Create attendance database
          community.postgresql.postgresql_db:
            name: "{{ postgresql_database }}"
            owner: "{{ postgresql_user }}"
            encoding: UTF8
            state: present
            login_unix_socket: /var/run/postgresql
          become_user: postgres

        - name: Verify attendance database
          community.postgresql.postgresql_query:
            db: postgres
            login_unix_socket: /var/run/postgresql
            query: >-
              SELECT datname
              FROM pg_database
              WHERE datname = '{{ postgresql_database }}';
          become_user: postgres
          register: database_check
          failed_when: database_check.rowcount | int != 1

        - name: Display success message
          ansible.builtin.debug:
            msg: "Database {{ postgresql_database }} is ready."

      rescue:
        - name: Display rollback message
          ansible.builtin.debug:
            msg: "Deployment failed. Starting PostgreSQL rollback."

        - name: Remove newly created attendance database
          community.postgresql.postgresql_db:
            name: "{{ postgresql_database }}"
            state: absent
            force: true
            login_unix_socket: /var/run/postgresql
          become_user: postgres
          when:
            - attendance_database_preexisting is defined
            - not attendance_database_preexisting | bool

        - name: Restore postgresql.conf
          ansible.builtin.copy:
            src: "{{ postgresql_backup_dir }}/postgresql.conf"
            dest: "{{ postgresql_conf }}"
            remote_src: true
            owner: postgres
            group: postgres
            mode: "0644"
          when:
            - lookup('ansible.builtin.fileglob',
                     postgresql_backup_dir + '/postgresql.conf',
                     wantlist=true) | length > 0

        - name: Restore pg_hba.conf
          ansible.builtin.copy:
            src: "{{ postgresql_backup_dir }}/pg_hba.conf"
            dest: "{{ postgresql_hba }}"
            remote_src: true
            owner: postgres
            group: postgres
            mode: "0640"
          when:
            - lookup('ansible.builtin.fileglob',
                     postgresql_backup_dir + '/pg_hba.conf',
                     wantlist=true) | length > 0

        - name: Restart PostgreSQL after rollback
          ansible.builtin.systemd:
            name: "{{ postgresql_service_name }}"
            state: restarted

        - name: Fail playbook after rollback
          ansible.builtin.fail:
            msg: "PostgreSQL deployment failed and rollback was completed."
```
