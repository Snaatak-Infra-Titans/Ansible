---
postgresql_version: "16"
postgresql_service_name: postgresql

postgresql_database: attendance_db
postgresql_user: postgres
postgresql_password: password
postgresql_port: 5432

postgresql_listen_addresses: "*"
postgresql_allowed_cidr: 10.0.0.0/24
postgresql_auth_method: scram-sha-256

postgresql_conf: "/etc/postgresql/{{ postgresql_version }}/main/postgresql.conf"
postgresql_hba: "/etc/postgresql/{{ postgresql_version }}/main/pg_hba.conf"

# Last known good configuration used during rollback
postgresql_backup_dir: /var/backups/otms-postgresql
postgresql_conf_backup: "{{ postgresql_backup_dir }}/postgresql.conf.last-known-good"
postgresql_hba_backup: "{{ postgresql_backup_dir }}/pg_hba.conf.last-known-good"
