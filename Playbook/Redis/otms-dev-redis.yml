---
- name: Install and Configure Redis
  hosts: redis
  become: true

  vars:
    redis_bind: "0.0.0.0"
    redis_port: 6379

  tasks:

    - name: Update apt cache
      apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Install Redis
      apt:
        name: redis-server
        state: present

    - name: Ensure Redis config directory exists
      file:
        path: /etc/redis
        state: directory
        owner: redis
        group: redis
        mode: "0755"

    - name: Configure Redis
      copy:
        dest: /etc/redis/redis.conf
        owner: redis
        group: redis
        mode: "0644"
        content: |
          bind {{ redis_bind }}
          protected-mode yes
          port {{ redis_port }}

          daemonize no
          supervised systemd

          dir /var/lib/redis

          loglevel notice
          logfile ""

          save ""

          appendonly no

    - name: Ensure Redis data directory exists
      file:
        path: /var/lib/redis
        state: directory
        owner: redis
        group: redis
        mode: "0755"

    - name: Restart systemd daemon
      systemd:
        daemon_reload: yes

    - name: Enable Redis
      systemd:
        name: redis-server
        enabled: yes

    - name: Start Redis
      systemd:
        name: redis-server
        state: started

    - name: Wait for Redis
      wait_for:
        port: 6379
        timeout: 30

    - name: Verify Redis
      command: redis-cli ping
      register: redis_ping
      changed_when: false

    - debug:
        msg: "{{ redis_ping.stdout }}"
