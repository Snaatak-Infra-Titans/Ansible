---
# Java

ubuntu_java_packages:
  - fontconfig
  - openjdk-21-jre

redhat_java_packages:
  - fontconfig
  - java-21-openjdk

# Jenkins Repository

jenkins_apt_key_url: "https://pkg.jenkins.io/debian-stable/jenkins.io-2026.key"

jenkins_apt_repo: "deb [signed-by=/etc/apt/keyrings/jenkins-keyring.asc] https://pkg.jenkins.io/debian-stable binary/"

jenkins_yum_repo: "https://pkg.jenkins.io/redhat-stable/jenkins.repo"

jenkins_rpm_key: "https://pkg.jenkins.io/redhat-stable/jenkins.io-2023.key"

# Jenkins

jenkins_service_name: jenkins
jenkins_home: /var/lib/jenkins
jenkins_url: "http://localhost:8080"

# Plugin Manager

plugin_manager_version: "2.13.2"

plugin_manager_url: "https://repo.jenkins-ci.org/releases/io/jenkins/plugin-management/plugin-management-cli/{{ plugin_manager_version }}/plugin-management-cli-{{ plugin_manager_version }}.jar"

plugin_manager_path: "/opt/jenkins/jenkins-plugin-manager.jar"

# Jenkins WAR

jenkins_war: "/usr/share/java/jenkins.war"

# Plugins

plugins_directory: "/var/lib/jenkins/plugins"
plugins_file: "plugins.txt"
