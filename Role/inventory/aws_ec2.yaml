---
plugin: amazon.aws.aws_ec2

regions:
  - us-east-1

filters:
  "tag:Name":  "dev-otms-postgresql-ec2"
  instance-state-name: running

hostnames:
  - instance-id

compose:
  ansible_host: instance_id
  ansible_connection: "'community.aws.aws_ssm'"
  ansible_aws_ssm_bucket_name: "'dev-otms-ansible-ssm'"
  ansible_aws_ssm_region: "'us-east-1'"

groups:
  postgresql: true

keyed_groups:
  - prefix: environment
    key: tags.environment

  - prefix: role
    key: tags.role
