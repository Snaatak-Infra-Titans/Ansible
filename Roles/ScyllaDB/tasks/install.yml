---
- name: Update APT package cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Install prerequisite packages
  ansible.builtin.apt:
    name:
      - curl
      - wget
      - gnupg
      - ca-certificates
      - apt-transport-https
      - lsb-release
    state: present

- name: Download ScyllaDB repository setup script
  ansible.builtin.get_url:
    url: "https://repositories.scylladb.com/scylla/check_version?system={{ ansible_distribution | lower }}&dist={{ ansible_distribution_release }}&version={{ scylla_version }}"
    dest: /tmp/scylla_repo.sh
    mode: "0755"

- name: Configure ScyllaDB repository
  ansible.builtin.command:
    cmd: /tmp/scylla_repo.sh
  args:
    creates: /etc/apt/sources.list.d/scylla.list

- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true

- name: Install ScyllaDB
  ansible.builtin.apt:
    name: "{{ scylla_package }}"
    state: present
