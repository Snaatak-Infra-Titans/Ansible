---
plugin: amazon.aws.aws_ec2

regions:
  - us-east-1

filters:
  "tag:Name": "dev-otms-scylla-ec2"
  instance-state-name: running

hostnames:
  - instance-id

compose:
  ansible_host: instance_id
  ansible_connection: "'amazon.aws.aws_ssm'"
  ansible_aws_ssm_bucket_name: "'dev-otms-ansible-ssm'"
  ansible_aws_ssm_region: "'us-east-1'"

groups:
  scylladb: true

keyed_groups:
  - prefix: environment
    key: ec2_tags.Environment

  - prefix: application
    key: ec2_tags.Application

  - prefix: owner
    key: ec2_tags.Owner
