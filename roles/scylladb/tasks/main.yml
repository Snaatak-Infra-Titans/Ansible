---
- name: Install ScyllaDB
  ansible.builtin.import_tasks: install.yml

- name: Configure ScyllaDB
  ansible.builtin.import_tasks: configure.yml

- name: Apply ScyllaDB configuration before readiness checks
  ansible.builtin.meta: flush_handlers

- name: Enable and Start ScyllaDB Service
  ansible.builtin.import_tasks: service.yml

- name: Create Application Keyspaces
  ansible.builtin.import_tasks: keyspace.yml

- name: Initialize Application Schemas
  ansible.builtin.import_tasks: schema.yml

- name: Verify ScyllaDB Installation
  ansible.builtin.import_tasks: verify.yml
